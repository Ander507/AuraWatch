<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#7B8A9D" />
		<!-- Instant first paint while JS/CSS hydrate (Vercel cold start) -->
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #7b8a9d;
				color: #111;
			}
			#aw-boot {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.65rem;
				font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
				pointer-events: none;
				z-index: 0;
			}
			#aw-boot[hidden] {
				display: none !important;
			}
			#aw-boot .aw-mark {
				font-size: 1.15rem;
				font-weight: 700;
				letter-spacing: 0.04em;
			}
			#aw-boot .aw-sub {
				font-size: 0.75rem;
				opacity: 0.7;
			}
			#aw-boot .aw-bar {
				width: 9rem;
				height: 3px;
				background: rgba(17, 17, 17, 0.15);
				overflow: hidden;
			}
			#aw-boot .aw-bar > i {
				display: block;
				width: 40%;
				height: 100%;
				background: #ff4c00;
				animation: aw-slide 1.1s ease-in-out infinite;
			}
			@keyframes aw-slide {
				0% {
					transform: translateX(-120%);
				}
				100% {
					transform: translateX(320%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#aw-boot .aw-bar > i {
					animation: none;
					width: 40%;
					transform: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="aw-boot" aria-hidden="true">
			<div class="aw-mark">AuraWatch</div>
			<div class="aw-bar"><i></i></div>
			<div class="aw-sub">loading…</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				function hide() {
					var el = document.getElementById('aw-boot');
					if (el) el.hidden = true;
				}
				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', function () {
						requestAnimationFrame(hide);
					});
				} else {
					requestAnimationFrame(hide);
				}
			})();
		</script>
	</body>
</html>
